<script>
const T="CHEMK STRIKE",cv=document.getElementById("c"),ctx=cv.getContext("2d");

let W,H,DPR,fs0,tmp,tc,noiseFine,noiseGrain,t0=0,raf=0,fadeSent=false;
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mkNoise(p,col,sz){const c=document.createElement("canvas");c.width=c.height=sz;const x=c.getContext("2d"),d=x.createImageData(sz,sz);
  for(let i=0;i<sz*sz;i++){const on=Math.random()<p;d.data[i*4]=col[0];d.data[i*4+1]=col[1];d.data[i*4+2]=col[2];d.data[i*4+3]=on?col[3]:0}
  x.putImageData(d,0,0);return c}
function resize(){
  DPR=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  tmp=document.createElement("canvas");tmp.width=W*DPR;tmp.height=H*DPR;tc=tmp.getContext("2d");tc.setTransform(DPR,0,0,DPR,0,0);
  ctx.font="100px CS";fs0=100*W*.57/ctx.measureText(T).width;
  noiseFine=mkNoise(.18,[0,0,0,255],256);noiseGrain=mkNoise(.5,[90,30,0,40],256);
}
function pat(c,img,r){const p=c.createPattern(img,"repeat");return p}
// текст с наклоном как у логотипа
function txt(c,s,size,x,y,color,sx=1){
  c.save();c.translate(x,y);c.transform(1,0,-SK,1,0,0);c.scale(sx,1);
  c.font=size+"px CS";c.textAlign="center";c.textBaseline="middle";c.fillStyle=color;c.fillText(s,0,0);c.restore()}
// огромные буквы, при erode — «изъеденные» шумом, как на оригинале
function giant(s,k,cx,cy,color,erode,alpha,r){
  tc.save();tc.setTransform(DPR,0,0,DPR,0,0);tc.clearRect(0,0,W,H);
  txt(tc,s,fs0*k,cx*W,cy*H,color);
  if(erode){tc.globalCompositeOperation="destination-out";
    tc.save();tc.translate(r()*256,r()*256);tc.fillStyle=pat(tc,noiseFine);tc.globalAlpha=erode;tc.fillRect(-256,-256,W+512,H+512);tc.restore();}
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=alpha==null?1:alpha;ctx.drawImage(tmp,0,0);ctx.restore();tc.restore()}
// горизонтальные срезы со сдвигом и растяжением
function smear(s,k,cy,r,thin){
  tc.save();tc.setTransform(DPR,0,0,DPR,0,0);tc.clearRect(0,0,W,H);
  txt(tc,s,fs0*k,W*.5,cy*H,"#1a0800");tc.restore();
  ctx.save();ctx.setTransform(1,0,0,1,0,0);
  for(let y=0;y<H*DPR;){const h=(thin?2+r()*5:5+r()*14)*DPR;
    if(r()>.3){const dx=(r()-.5)*W*.5*DPR,sx=1+r()*1.2;ctx.drawImage(tmp,0,y,W*DPR,h,dx-W*DPR*(sx-1)/2,y,W*DPR*sx,h)}
    y+=h+(r()<.4?h*r()*2:0)}
  ctx.restore()}
// наклонная колонка тёмных полос (как на кадре 143)
function bars(x0,y0,n,r,wmul){
  for(let i=0;i<n;i++){const y=(y0+i*.045)*H,x=(x0+i*.012)*W,w=W*(.03+r()*.1)*(wmul||1);
    ctx.save();ctx.transform(1,0,-SK,1,x,y);ctx.fillStyle="#150600";ctx.fillRect(0,0,w,H*(.006+r()*.012));ctx.restore()}}
function logo(){txt(ctx,T,fs0,W/2,H*.5,INK)}
function two(dx,dy){txt(ctx,"CHEMK",fs0,W*(.33+dx),H*(.66+dy),INK);txt(ctx,"STRIKE",fs0,W*(.67+dx),H*(.57+dy),INK)}
function micro(r,big){
  const n=1+Math.floor(r()*4);
  for(let i=0;i<n;i++){ctx.save();ctx.transform(1,0,-SK,1,W*(.35+r()*.55),H*(.1+r()*.75));ctx.fillStyle=INK;ctx.fillRect(0,0,W*(.02+r()*.07),H*(.004+r()*.006));ctx.restore()}
  if(big)giant(big,2.6+r()*1.5,.6+r()*.35,.12+r()*.3,INK,0,1,r)}

function grain(r){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.translate(Math.floor(Math.random()*256),Math.floor(Math.random()*256));
  ctx.fillStyle=ctx.createPattern(noiseGrain,"repeat");ctx.fillRect(-256,-256,W*DPR+512,H*DPR+512);ctx.restore()}
// заставка BWAVES (в оригинале — красная плашка VALVE, последняя буква мелкая и приподнята)
const LOGO_MS=2400,BOX_K=1.75,TEXT_K=1.1,TEXT_H=1.3,BW="BWAVES";
function bwaves(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
  const u=Math.min(W/1280,H/720),ts=u*TEXT_K,fam="Helvetica Neue,Helvetica,Arial,sans-serif",
    bigF=38*ts,smF=24*ts,big="700 "+bigF+"px "+fam,small="700 "+smF+"px "+fam,gap=11*ts,pad=18*ts;
  ctx.textBaseline="alphabetic";
  const L=[...BW].map((ch,i)=>{ctx.font=i<BW.length-1?big:small;return{ch,w:ctx.measureText(ch).width,sm:i===BW.length-1}});
  const bw=pad*2+L.reduce((a,l)=>a+l.w,0)+gap*(L.length-1)+3*ts,bh=48*u*BOX_K,x0=W/2-bw/2,y0=H/2-bh/2;
  ctx.fillStyle="#F74742";ctx.fillRect(x0,y0,bw,bh);
  ctx.fillStyle="#000";let x=x0+pad;
  const cap=.716*bigF*TEXT_H,top=H/2-cap/2; // капитель по центру плашки
  L.forEach(l=>{ctx.font=l.sm?small:big;ctx.save();ctx.translate(x,l.sm?top+.716*smF*TEXT_H:top+cap);ctx.scale(1,TEXT_H);ctx.fillText(l.ch,0,0);ctx.restore();x+=l.w+gap});
}
function frame(now){
  let t=now-t0;ctx.setTransform(DPR,0,0,DPR,0,0);
  if(t<LOGO_MS){bwaves();raf=requestAnimationFrame(frame);return}
  t=t-LOGO_MS-100+300; // 100 мс чёрного после плашки, дальше — сцены как раньше
  if(t<300){ctx.fillStyle="#000";ctx.fillRect(0,0,W,H)}
  else{
    ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);

    ctx.setTransform(DPR,0,0,DPR,0,0);grain();
    if(t>=3300){
      if(!fadeSent){fadeSent=true;if(window.parent!==window)parent.postMessage({type:"chemk-intro-fade"},"*")}
      const u=Math.min(1,(t-3300)/1700),d=.29+.71*u*u;
      ctx.globalCompositeOperation="destination-out";ctx.fillStyle=`rgba(0,0,0,${d})`;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation="source-over"
    }
  }
  if(t<5100)raf=requestAnimationFrame(frame);else{ctx.clearRect(0,0,cv.width,cv.height);if(window.parent!==window)parent.postMessage({type:"chemk-intro-complete"},"*")}
}
const introAlreadyPlayed=sessionStorage.getItem("chemkIntroPlayed")==="true";
if(introAlreadyPlayed){
  cv.style.display="none";
  if(window.parent!==window)parent.postMessage({type:"chemk-intro-complete"},"*");
}else sessionStorage.setItem("chemkIntroPlayed","true");
function startIntro(){t0=performance.now();raf=requestAnimationFrame(frame)}
document.fonts.load("20px CS").then(()=>{resize();if(!introAlreadyPlayed)startIntro()});
